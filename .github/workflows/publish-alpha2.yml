name: Publish Alpha 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --stacktrace

      - name: Verify Alpha 2 JAR and recipes
        run: |
          JAR='build/libs/tf2teleporter-1.0.0-alpha.2.jar'
          test -f "$JAR"
          for path in data/tf2teleporter/recipe/teleporter_base_a.json data/tf2teleporter/recipe/teleporter_base_b.json data/tf2teleporter/recipe/teleporter_propeller.json data/tf2teleporter/recipe/red_teleporter.json data/tf2teleporter/recipe/blue_teleporter.json data/tf2teleporter/recipe/red_teleporter_recolor.json data/tf2teleporter/recipe/blue_teleporter_recolor.json assets/tf2teleporter/textures/item/teleporter_base.png assets/tf2teleporter/textures/item/teleporter_propeller.png; do
            jar tf "$JAR" | grep -Fx "$path"
          done
          unzip -p "$JAR" assets/tf2teleporter/textures/item/teleporter_base.png > /tmp/base.png
          unzip -p "$JAR" assets/tf2teleporter/textures/item/teleporter_propeller.png > /tmp/propeller.png
          echo 'a4507a70928402051525fd3811b455554cc61604d9c3eeb7173f3d8a695dcc03  /tmp/base.png' | sha256sum -c -
          echo 'fcbb3a147e61e23133c058d48e39c4ca9dd8afae416955c4df8196fe32cc3f4f  /tmp/propeller.png' | sha256sum -c -

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          Alpha 2 of the NeoForge 1.21.1 TF2 Teleporters port.

          - Restores the original 1.7.10 crafting progression
          - Adds TF2 Teleporter Base and TF2 Teleporter Propeller as craftable component items
          - Restores the original 16x16 component textures
          - Restores both original Teleporter Base recipe layouts
          - Restores the original Propeller recipe
          - RED and BLU teleporters are crafted from dye + propeller + base
          - RED <-> BLU recoloring recipes restored
          - Teleporter and component stack size restored to 1
          - Keeps Alpha 1 frequency, model, GUI, animation and original sound behavior

          Note: the second Base recipe in the 1.7.10 bytecode contains a malformed two-character middle row (`" X"`). Alpha 2 pads the missing empty slot to `" X "` so the intended layout is valid in modern Minecraft without changing ingredient positions.

          This is still a pre-release and needs live client/server testing.
          EOF

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0-alpha.2 'build/libs/tf2teleporter-1.0.0-alpha.2.jar#TF2 Teleporters 1.21.1 - Alpha 2' --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'TF2 Teleporters 1.21.1 — Alpha 2' --notes-file release-notes.md --prerelease

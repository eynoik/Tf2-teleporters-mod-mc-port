name: Publish Alpha 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-alpha1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build and verify original assets
        run: gradle build --stacktrace

      - name: Verify release JAR
        run: test -f build/libs/tf2teleporter-1.0.0-alpha.1.jar

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          First NeoForge 1.21.1 alpha of the TF2 Teleporters port.

          - NeoForge 1.21.1 / Java 21
          - RED and BLU teleporters
          - Frequencies 1-99
          - Maximum two teleporters per frequency
          - Teleports players and mobs
          - Original GUI, spin sound and teleport sound restored and SHA-256 verified during the build
          - Original-style model and spinning animation ported to the 1.21.1 renderer

          This is a pre-release. It has passed the automated build and asset-integrity checks, but has not yet been extensively tested in a live Minecraft client/server session.
          EOF

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0-alpha.1 \
            'build/libs/tf2teleporter-1.0.0-alpha.1.jar#TF2 Teleporters 1.21.1 - Alpha 1' \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'TF2 Teleporters 1.21.1 — Alpha 1' \
            --notes-file release-notes.md \
            --prerelease
